<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-6: Quên mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .card h2 {
            margin-bottom: 8px;
            text-align: center;
            color: #333;
        }
        .card p.subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-submit:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.success { color: #28a745; }
        .message.error { color: #dc3545; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Quên Mật Khẩu</h2>
        <p class="subtitle">Nhập email tài khoản của bạn để nhận liên kết đặt lại mật khẩu.</p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Nhập email của bạn"
                       autocomplete="email">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                Gửi liên kết đặt lại
            </button>
        </form>

        <div id="message" class="message"></div>
        <a href="Login.html" class="back-link">← Quay lại trang đăng nhập</a>
    </div>

    <script>
        // Cấu hình API
        const API_URL = 'http://localhost:3000';

        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageDiv.textContent = '';
            messageDiv.className = 'message';

            const email = emailInput.value.trim();
            if (!email) {
                showMessage('Vui lòng nhập email.', 'error');
                return;
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Đang gửi...';

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage(data.message, 'success');
                    emailInput.value = '';
                } else if (res.status === 429) {
                    showMessage('Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau.', 'error');
                } else {
                    showMessage(data.message || 'Có lỗi xảy ra. Vui lòng thử lại.', 'error');
                }
            } catch (err) {
                showMessage('Không thể kết nối máy chủ. Vui lòng thử lại sau.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Gửi liên kết đặt lại';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
