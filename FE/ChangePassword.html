<!DOCTYPE html>
<html lang="vi">
<head><script src="/authGuard.js" data-required="administrator,training_manager,instructor,teaching_assistant,student,admissions,accountant,visitor"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-7: Đổi mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .change-password-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .change-password-card h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="change-password-card">
        <h2>Đổi Mật Khẩu</h2>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input type="password" id="currentPassword" required placeholder="Nhập mật khẩu cũ">
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" required placeholder="Nhập mật khẩu mới">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
            </div>
            <button type="submit" class="btn-submit">Cập nhật mật khẩu</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <p style="text-align:center"><a href="/Workspace.html">Về trang quản lý</a></p>
<script>document.getElementById('changePasswordForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message'),p=document.getElementById('newPassword').value;if(p!==document.getElementById('confirmPassword').value){m.textContent='Mật khẩu xác nhận không khớp.';return;}const button=e.target.querySelector('button');button.disabled=true;try{const response=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('tms_token')},body:JSON.stringify({currentPassword:document.getElementById('currentPassword').value,newPassword:p})});const result=await response.json();if(!response.ok)throw Error(result.message);localStorage.clear();m.style.color='green';m.textContent=result.message;setTimeout(()=>location.assign('/Login.html'),1600)}catch(error){m.style.color='red';m.textContent=error.message}finally{button.disabled=false}};</script>
</body>
</html>
