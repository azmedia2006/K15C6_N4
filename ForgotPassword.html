<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-39: Quên mật khẩu - Đào tạo TMS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .card {
            background: #ffffff;
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 440px;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand .badge {
            display: inline-block;
            background: #e3f2fd;
            color: #0d47a1;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .brand h2 {
            font-size: 24px;
            color: #0d1b2a;
            font-weight: 700;
        }
        .brand p.subtitle {
            font-size: 14px;
            color: #6c757d;
            margin-top: 6px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-submit:hover:not(:disabled) {
            background-color: #0052a3;
        }
        .btn-submit:active:not(:disabled) {
            transform: scale(0.99);
        }
        .btn-submit:disabled {
            background-color: #90b8e0;
            cursor: not-allowed;
        }
        .message {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <span class="badge">Hệ Thống Đào Tạo TMS</span>
            <h2>Quên Mật Khẩu</h2>
            <p class="subtitle">Nhập địa chỉ email liên kết với tài khoản TMS của bạn để nhận liên kết khôi phục mật khẩu.</p>
        </div>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <input type="email" id="email" required placeholder="vidu: daotaotms@tuoitre24h.com"
                       autocomplete="email" autofocus>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">
                Gửi liên kết đặt lại
            </button>
        </form>

        <div id="message" class="message"></div>

        <a href="Login.html" class="back-link">← Quay lại trang đăng nhập</a>
    </div>

    <script>
        // Tự động nhận diện domain hiện tại (Vercel hoặc Local)
        const API_URL = (window.location.origin && window.location.origin !== "null")
            ? window.location.origin.replace(/\/$/, '')
            : '';

        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';

            const email = emailInput.value.trim().toLowerCase();
            if (!email) {
                showMessage('Vui lòng nhập địa chỉ email hợp lệ.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Đang gửi yêu cầu...';

            try {
                const endpoint = `${API_URL}/api/auth/forgot-password`;
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok) {
                    showMessage(data.message || 'Nếu email thuộc tài khoản hợp lệ, liên kết đặt lại mật khẩu đã được gửi đến hộp thư của bạn.', 'success');
                    form.reset();
                } else {
                    showMessage(data.message || 'Không thể gửi yêu cầu đặt lại mật khẩu. Vui lòng thử lại.', 'error');
                }
            } catch (err) {
                showMessage('Không thể kết nối đến máy chủ. Vui lòng kiểm tra kết nối mạng và thử lại.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Gửi liên kết đặt lại';
            }
        });

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
