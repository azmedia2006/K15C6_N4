
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KN-72 | Quản lý buổi học</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: Arial, sans-serif;
            background: #0b1220; color: #e5e7eb;
        }
        main { max-width: 1000px; margin: 35px auto; padding: 20px; }
        header { margin-bottom: 24px; }
        h1 { color: #67e8f9; margin-bottom: 8px; }
        .panel {
            background: #111c30; border: 1px solid #263650;
            border-radius: 14px; padding: 20px; margin-bottom: 18px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        label { display: block; margin-bottom: 7px; color: #a5b4fc; }
        input, select, textarea, button {
            width: 100%; padding: 11px; border-radius: 8px;
            border: 1px solid #35445e; font: inherit;
        }
        input, select, textarea {
            background: #0b1220; color: white; margin-bottom: 14px;
        }
        textarea { min-height: 80px; resize: vertical; }
        button {
            background: #0891b2; color: white; border: 0;
            cursor: pointer; font-weight: bold;
        }
        button:hover { background: #0e7490; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .notice { margin: 12px 0; white-space: pre-wrap; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 10px; text-align: left;
            border-bottom: 1px solid #35445e;
        }
        th { color: #67e8f9; }
        .table-wrap { overflow-x: auto; }
        @media(max-width: 650px) {
            .grid { grid-template-columns: 1fr; }
            main { margin: 10px auto; padding: 12px; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>KN-72 / Course Sessions</h1>
        <p>Quản lý buổi học theo môn học</p>
    </header>

    <section class="panel">
        <h2>1. Tạo môn học</h2>
        <form id="courseForm">
            <label for="courseName">Tên môn học</label>
            <input id="courseName" maxlength="120" required placeholder="Ví dụ: Lập trình Java">
            <label for="maxSessions">Số buổi tối đa</label>
            <input id="maxSessions" type="number" min="1" required value="5">
            <button>Tạo môn học</button>
        </form>
    </section>

    <section class="panel">
        <h2>2. Chọn môn học</h2>
        <label for="courseSelect">Môn cần quản lý</label>
        <select id="courseSelect"></select>
        <p id="courseInfo" aria-live="polite"></p>
    </section>

    <section class="panel">
        <h2>3. Khai báo buổi học</h2>
        <form id="sessionForm">
            <div class="grid">
                <div>
                    <label for="sessionNumber">Số thứ tự</label>
                    <input id="sessionNumber" type="number" min="1" required>
                </div>
                <div>
                    <label for="topic">Chủ đề</label>
                    <input id="topic" maxlength="200" required placeholder="Ví dụ: Biến và kiểu dữ liệu">
                </div>
            </div>
            <label for="objective">Mục tiêu buổi học</label>
            <textarea id="objective" maxlength="2000" required
                      placeholder="Sau buổi học, sinh viên có thể..."></textarea>
            <button>Thêm buổi học</button>
        </form>
    </section>

    <section class="panel">
        <h2>4. Nhân bản danh sách buổi học</h2>
        <label for="sourceSelect">Môn nguồn</label>
        <select id="sourceSelect"></select>
        <button id="copyButton" type="button">Nhân bản sang môn đang chọn</button>
    </section>

    <section class="panel">
        <h2>5. Danh sách buổi học</h2>
        <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Buổi</th><th>Chủ đề</th><th>Mục tiêu</th></tr>
                </thead>
                <tbody id="sessionRows"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    const $ = id => document.getElementById(id);
    let courses = [];
    let currentSessions = [];
    let sessionLoadVersion = 0;

    function notify(message) {
        $("notice").textContent = message;
    }

    async function api(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {})
            }
        });

        if (!response.ok) {
            let message = "Có lỗi xảy ra";
            try {
                const body = await response.json();
                if (body.detail) message = body.detail;
                else if (body.message) message = body.message;
                else if (body.error) message = body.error;
            } catch {
                message = await response.text() || message;
            }
            throw new Error(message);
        }

        if (response.status === 204) return null;
        return response.json();
    }

    function selectedCourseId() {
        return Number($("courseSelect").value);
    }

    function renderCourses() {
        const oldCourse = $("courseSelect").value;
        const oldSource = $("sourceSelect").value;

        for (const id of ["courseSelect", "sourceSelect"]) {
            const select = $(id);
            select.replaceChildren();

            courses.forEach(course => {
                const option = document.createElement("option");
                option.value = course.id;
                option.textContent =
                    `${course.name} (tối đa ${course.maxSessions} buổi)`;
                select.append(option);
            });
        }

        if (courses.some(c => String(c.id) === oldCourse)) {
            $("courseSelect").value = oldCourse;
        }
        if (courses.some(c => String(c.id) === oldSource)) {
            $("sourceSelect").value = oldSource;
        }

        const selected = courses.find(
            c => c.id === selectedCourseId()
        );
        $("courseInfo").textContent = selected
            ? `Giới hạn: ${selected.maxSessions} buổi`
            : "Chưa có môn học. Hãy tạo môn học trước.";
    }

    function renderSessions() {
        const tbody = $("sessionRows");
        tbody.replaceChildren();

        if (currentSessions.length === 0) {
            const tr = document.createElement("tr");
            const td = document.createElement("td");
            td.colSpan = 3;
            td.textContent = "Môn học chưa có buổi học nào.";
            tr.append(td);
            tbody.append(tr);
            return;
        }

        currentSessions.forEach(session => {
            const tr = document.createElement("tr");

            [session.sessionNumber, session.topic, session.objective]
                .forEach(value => {
                    const td = document.createElement("td");
                    td.textContent = value;
                    tr.append(td);
                });

            tbody.append(tr);
        });
    }

    async function loadCourses() {
        courses = await api("/api/courses");
        renderCourses();
        await loadSessions();
    }

    async function loadSessions() {
        const id = selectedCourseId();
        const requestVersion = ++sessionLoadVersion;
        if (!id) {
            currentSessions = [];
            renderSessions();
            $("sessionForm").querySelector("button").disabled = true;
            $("copyButton").disabled = true;
            $("sessionNumber").value = "";
            $("courseInfo").textContent = "Chưa có môn học. Hãy tạo môn học trước.";
            return;
        }

        currentSessions = [];
        renderSessions();
        $("sessionForm").querySelector("button").disabled = true;
        $("copyButton").disabled = true;

        const loadedSessions = await api(`/api/courses/${id}/sessions`);
        if (requestVersion !== sessionLoadVersion || id !== selectedCourseId()) {
            return;
        }
        currentSessions = loadedSessions;
        renderSessions();

        const course = courses.find(c => c.id === id);
        const usedNumbers = new Set(currentSessions.map(session => session.sessionNumber));
        let nextNumber = 1;
        while (usedNumbers.has(nextNumber) && nextNumber <= (course?.maxSessions || 0)) {
            nextNumber++;
        }
        if (!course || nextNumber > course.maxSessions) nextNumber = null;
        $("sessionNumber").value = nextNumber || "";
        $("sessionNumber").max = course?.maxSessions || "";

        const full = course &&
            currentSessions.length >= course.maxSessions;

        $("sessionForm").querySelector("button").disabled = !!full || !nextNumber;
        $("copyButton").disabled = !!full;

        $("courseInfo").textContent = course
            ? `Đã khai báo ${currentSessions.length}/${course.maxSessions} buổi`
            : "";
    }

    $("courseForm").addEventListener("submit", async event => {
        event.preventDefault();
        const button = event.currentTarget.querySelector("button");
        button.disabled = true;
        try {
            await api("/api/courses", {
                method: "POST",
                body: JSON.stringify({
                    name: $("courseName").value.trim(),
                    maxSessions: Number($("maxSessions").value)
                })
            });
            $("courseForm").reset();
            $("maxSessions").value = 5;
            await loadCourses();
            notify("Tạo môn học thành công.");
        } catch (error) {
            notify(error.message);
        } finally {
            button.disabled = false;
        }
    });

    $("sessionForm").addEventListener("submit", async event => {
        event.preventDefault();
        const id = selectedCourseId();

        if (!id) return notify("Hãy tạo và chọn môn học trước.");

        const button = $("sessionForm").querySelector("button");
        button.disabled = true;
        try {
            await api(`/api/courses/${id}/sessions`, {
                method: "POST",
                body: JSON.stringify({
                    sessionNumber: Number($("sessionNumber").value),
                    topic: $("topic").value.trim(),
                    objective: $("objective").value.trim()
                })
            });
            $("topic").value = "";
            $("objective").value = "";
            await loadSessions();
            notify("Thêm buổi học thành công.");
        } catch (error) {
            notify(error.message);
        } finally {
            if (selectedCourseId() === id) {
                const course = courses.find(item => item.id === id);
                button.disabled = !course ||
                    currentSessions.length >= course.maxSessions;
            }
        }
    });

    $("copyButton").addEventListener("click", async () => {
        const targetId = selectedCourseId();
        const sourceId = Number($("sourceSelect").value);

        if (!targetId || !sourceId) {
            return notify("Hãy chọn môn nguồn và môn đích.");
        }
        if (targetId === sourceId) {
            return notify("Môn nguồn và môn đích phải khác nhau.");
        }

        if (!confirm("Bạn có chắc muốn nhân bản danh sách buổi học?")) {
            return;
        }

        $("copyButton").disabled = true;
        try {
            await api(`/api/courses/${targetId}/sessions/copy`, {
                method: "POST",
                body: JSON.stringify({ sourceCourseId: sourceId })
            });
            await loadSessions();
            notify("Nhân bản danh sách thành công.");
        } catch (error) {
            notify(error.message);
        } finally {
            const course = courses.find(item => item.id === targetId);
            $("copyButton").disabled = selectedCourseId() !== targetId ||
                !course || currentSessions.length >= course.maxSessions;
        }
    });

    $("courseSelect").addEventListener("change", async () => {
        try {
            await loadSessions();
            notify("");
        } catch (error) {
            notify(error.message);
        }
    });

    loadCourses().catch(error => notify(error.message));
</script>
</body>
</html>
