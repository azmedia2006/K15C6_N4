<!DOCTYPE html>
<html lang="vi">
<head><script src="/authGuard.js" data-required="administrator,training_manager,instructor,teaching_assistant,student,admissions,accountant,visitor"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-7: Đổi mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        .change-password-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .change-password-card h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .password-field {
            display: flex;
            gap: 8px;
        }
        .password-field input {
            flex: 1;
            min-width: 0;
        }
        .toggle-password {
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .field-hint {
            display: block;
            margin-top: 6px;
            color: #666;
            font-size: 13px;
        }
        .field-hint.error {
            color: #b42318;
        }
        .field-hint:empty {
            display: none;
        }
        @media (max-width: 480px) {
            .change-password-card {
                padding: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="change-password-card">
        <h2 id="changePasswordTitle">Đổi Mật Khẩu</h2>
        <form id="changePasswordForm" aria-labelledby="changePasswordTitle">
            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <div class="password-field">
                    <input type="password" id="currentPassword" autocomplete="current-password" required placeholder="Nhập mật khẩu cũ">
                    <button type="button" class="toggle-password" data-target="currentPassword" aria-controls="currentPassword" aria-pressed="false">Hiện</button>
                </div>
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="password-field">
                    <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="128" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,128}" title="Mật khẩu cần 8–128 ký tự, gồm chữ hoa, chữ thường và số." aria-describedby="passwordHint passwordReuseHint" required placeholder="Nhập mật khẩu mới">
                    <button type="button" class="toggle-password" data-target="newPassword" aria-controls="newPassword" aria-pressed="false">Hiện</button>
                </div>
                <small id="passwordHint" class="field-hint">Mật khẩu gồm 8–128 ký tự, có chữ hoa, chữ thường và chữ số.</small>
                <small id="passwordReuseHint" class="field-hint error" aria-live="polite"></small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <div class="password-field">
                    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="confirmPasswordHint" required placeholder="Nhập lại mật khẩu mới">
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-controls="confirmPassword" aria-pressed="false">Hiện</button>
                </div>
                <small id="confirmPasswordHint" class="field-hint" aria-live="polite"></small>
            </div>
            <button type="submit" class="btn-submit">Cập nhật mật khẩu</button>
        </form>
        <div id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <p style="text-align:center"><a href="/Workspace.html">Về trang quản lý</a></p>
<script>document.querySelectorAll('.toggle-password').forEach(button=>{button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target);const visible=input.type==='password';input.type=visible?'text':'password';button.textContent=visible?'Ẩn':'Hiện';button.setAttribute('aria-pressed',String(visible));});});</script>
<script>const currentPasswordInput=document.getElementById('currentPassword'),passwordReuseHint=document.getElementById('passwordReuseHint');function validateNewPassword(){const reused=newPasswordInput.value&&newPasswordInput.value===currentPasswordInput.value;newPasswordInput.setCustomValidity(reused?'Mật khẩu mới phải khác mật khẩu hiện tại.':'');passwordReuseHint.textContent=reused?'Mật khẩu mới phải khác mật khẩu hiện tại.':'';}currentPasswordInput.addEventListener('input',validateNewPassword);newPasswordInput.addEventListener('input',validateNewPassword);</script>
<script>const newPasswordInput=document.getElementById('newPassword'),confirmPasswordInput=document.getElementById('confirmPassword'),confirmPasswordHint=document.getElementById('confirmPasswordHint');function validateConfirmation(){const mismatch=confirmPasswordInput.value&&newPasswordInput.value!==confirmPasswordInput.value;confirmPasswordInput.setCustomValidity(mismatch?'Mật khẩu xác nhận không khớp.':'');confirmPasswordHint.textContent=mismatch?'Mật khẩu xác nhận không khớp.':'';confirmPasswordHint.classList.toggle('error',Boolean(mismatch));}newPasswordInput.addEventListener('input',validateConfirmation);confirmPasswordInput.addEventListener('input',validateConfirmation);</script>
<script>document.getElementById('changePasswordForm').onsubmit=async e=>{e.preventDefault();const form=e.target,m=document.getElementById('message'),p=document.getElementById('newPassword').value;if(p!==document.getElementById('confirmPassword').value){m.textContent='Mật khẩu xác nhận không khớp.';return;}const button=form.querySelector('.btn-submit');button.disabled=true;button.textContent='Đang cập nhật...';form.setAttribute('aria-busy','true');try{const response=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('tms_token')},body:JSON.stringify({currentPassword:document.getElementById('currentPassword').value,newPassword:p})});const result=await response.json();if(!response.ok)throw Error(result.message);['tms_token','token','tms_current_role','tms_current_user','tms_user'].forEach(key=>localStorage.removeItem(key));button.textContent='Đã cập nhật';m.style.color='green';m.textContent=result.message;setTimeout(()=>location.assign('/Login.html'),1600)}catch(error){m.style.color='red';m.textContent=error.message}finally{form.removeAttribute('aria-busy');if(button.textContent==='Đang cập nhật...'){button.disabled=false;button.textContent='Cập nhật mật khẩu'}}};</script>
</body>
</html>
