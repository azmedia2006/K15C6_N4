<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-7: Đổi mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .change-password-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .change-password-card h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="change-password-card">
        <h2>Đổi Mật Khẩu</h2>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại *</label>
                <input type="password" id="currentPassword" required placeholder="Nhập mật khẩu cũ">
            </div>
            <div class="form-group">
                <label for="newPassword">Mật khẩu mới *</label>
                <input type="password" id="newPassword" required placeholder="Tối thiểu 8 ký tự, có cả chữ và số">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới *</label>
                <input type="password" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
            </div>
            
            <!-- Thêm tùy chọn Thu hồi các phiên đăng nhập khác -->
            <div class="form-checkbox">
                <input type="checkbox" id="revokeOtherSessions" checked>
                <label for="revokeOtherSessions">Đăng xuất khỏi tất cả các thiết bị khác</label>
            </div>

            <button type="submit" class="btn-submit">Cập nhật mật khẩu</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const revokeOtherSessions = document.getElementById('revokeOtherSessions').checked;
            const messageDiv = document.getElementById('message');

            // Kiểm tra khớp mật khẩu
            if (newPassword !== confirmPassword) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Mật khẩu mới và xác nhận mật khẩu không khớp!';
                return;
            }

            // Regex kiểm tra mật khẩu tối thiểu 8 ký tự, phải chứa ít nhất 1 chữ cái và 1 chữ số
            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
            if (!passwordRegex.test(newPassword)) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Mật khẩu mới phải có tối thiểu 8 ký tự, bao gồm cả chữ và số!';
                return;
            }

            // Dữ liệu sẵn sàng gửi lên Backend API
            const payload = {
                currentPassword: currentPassword,
                newPassword: newPassword,
                revokeOtherSessions: revokeOtherSessions // Đăng xuất các phiên khác
            };

            console.log('Dữ liệu gửi Backend:', payload);

            messageDiv.style.color = 'green';
            messageDiv.textContent = 'Đổi mật khẩu thành công!';
        });
    </script>
</body>
</html>
