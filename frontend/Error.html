<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f8">
    <title>Không thể mở trang | TMS</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #172b3a;
            background: #f4f6f8;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            background-image: linear-gradient(rgba(23, 43, 58, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 43, 58, .035) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .page-shell {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            padding: 28px clamp(20px, 5vw, 72px);
        }

        .brand {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 11px;
            color: #172b3a;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 34px;
            aspect-ratio: 1;
            place-items: center;
            border-radius: 8px;
            background: #087e73;
            color: #fff;
            font-size: 19px;
            font-weight: 800;
        }

        main {
            display: grid;
            flex: 1;
            place-items: center;
            padding: 48px 0;
        }

        .error-panel {
            display: grid;
            width: min(100%, 880px);
            grid-template-columns: minmax(0, 1fr) 220px;
            align-items: center;
            gap: 48px;
            padding: clamp(28px, 6vw, 64px);
            border: 1px solid #d8e0e5;
            border-radius: 8px;
            background: rgba(255, 255, 255, .96);
            box-shadow: 0 18px 48px rgba(23, 43, 58, .08);
        }

        .eyebrow {
            margin: 0 0 22px;
            color: #087e73;
            font-size: 12px;
            font-weight: 750;
            text-transform: uppercase;
        }

        .error-code {
            margin: 0 0 8px;
            color: #087e73;
            font-size: 64px;
            font-weight: 750;
            line-height: 1;
        }

        h1 {
            max-width: 560px;
            margin: 0;
            font-size: clamp(26px, 4vw, 36px);
            line-height: 1.16;
        }

        .message {
            max-width: 520px;
            margin: 16px 0 0;
            color: #526574;
            font-size: 16px;
            line-height: 1.65;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 30px;
        }

        .button {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            text-decoration: none;
            transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
        }

        .button:hover { transform: translateY(-1px); }
        .button:focus-visible { outline: 3px solid #8bd4cc; outline-offset: 2px; }

        .button-primary { background: #087e73; color: #fff; }
        .button-primary:hover { background: #06685f; }
        .button-secondary { border-color: #cbd5dc; background: #fff; color: #253a49; }
        .button-secondary:hover { background: #f4f7f8; border-color: #9aabb6; }

        .visual {
            display: grid;
            min-height: 210px;
            place-items: center;
            border-left: 1px solid #e1e7eb;
        }

        .status-mark {
            display: grid;
            width: 132px;
            aspect-ratio: 1;
            place-items: center;
            border: 1px solid #aedbd5;
            border-radius: 50%;
            background: #e7f5f2;
            color: #087e73;
            font-size: 58px;
            font-weight: 400;
            line-height: 1;
        }

        footer {
            color: #71818c;
            font-size: 12px;
        }

        @media (max-width: 640px) {
            .page-shell { padding: 20px; }
            main { padding: 32px 0; }
            .error-panel { grid-template-columns: 1fr; gap: 26px; }
            .visual { display: none; }
            .error-code { font-size: 52px; }
            .actions { align-items: stretch; flex-direction: column; }
            .button { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <a class="brand" id="error-brand-home" href="./Login.html" aria-label="TMS, về trang chính">
            <span class="brand-mark" aria-hidden="true">T</span>
            <span>ĐÀO TẠO TMS</span>
        </a>

        <main>
            <section class="error-panel" aria-labelledby="error-title">
                <div>
                    <p class="eyebrow">Yêu cầu không thể hoàn tất</p>
                    <p class="error-code" id="error-code" aria-label="Mã lỗi"></p>
                    <h1 id="error-title"></h1>
                    <p class="message" id="error-message" role="status" aria-live="polite"></p>
                    <div class="actions">
                        <a class="button button-primary" id="error-home" href="./Login.html"></a>
                        <button class="button button-secondary" id="error-back" type="button">Quay lại</button>
                    </div>
                </div>
                <div class="visual" aria-hidden="true">
                    <span class="status-mark">!</span>
                </div>
            </section>
        </main>

        <footer>Training Management System</footer>
    </div>
    <script src="./error-handler.js"></script>
    <script>
        window.TmsErrorHandler.initializePage();
    </script>
</body>
</html>
