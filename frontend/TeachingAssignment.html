
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KN-128 | Phân công giảng dạy - TMS</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        header {
            background: #1d4ed8;
            padding: 22px 35px;
            color: white;
        }

        header h1 { margin: 0 0 8px; font-size: 24px; }
        header p { margin: 0; opacity: .9; }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .panel {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px #0000000d;
        }

        .field { margin-bottom: 24px; }

        label.field-label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        .assistants {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 14px;
        }

        .assistant-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            cursor: pointer;
        }

        .assistant-option input {
            width: 17px;
            height: 17px;
        }

        .hint {
            color: #64748b;
            font-size: 13px;
            margin-top: 7px;
        }

        button {
            border: 0;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 13px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <h1>Phân công giảng viên và trợ giảng</h1>
    <p>KN-128 | Hệ thống quản lý đào tạo TMS</p>
</header>

<main>
    <a class="back" href="./Index.html">← Quay lại Dashboard</a>

    <div class="panel">
        <form id="assignmentForm">

            <div class="field">
                <label class="field-label" for="subject">
                    1. Chọn môn học
                </label>
                <select id="subject" required>
                    <option value="">Đang tải môn học...</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label" for="class">
                    2. Chọn lớp học
                </label>
                <select id="class" required>
                    <option value="">Chọn môn học trước</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label" for="instructor">
                    3. Giảng viên chính
                </label>
                <select id="instructor" required>
                    <option value="">Đang tải giảng viên...</option>
                </select>
                <div class="hint">
                    Mỗi môn trong lớp có một giảng viên chính.
                </div>
            </div>

            <div class="field">
                <label class="field-label">
                    4. Trợ giảng
                </label>
                <div id="assistants" class="assistants">
                    Đang tải trợ giảng...
                </div>
                <div class="hint">
                    Có thể chọn nhiều trợ giảng hoặc không chọn ai.
                </div>
            </div>

            <button type="submit" id="saveBtn" disabled>
                Lưu phân công
            </button>

            <div id="message" role="status" aria-live="polite"></div>
        </form>
    </div>
</main>

<script>
    const token = localStorage.getItem("tms_token");

    if (!token) {
        window.location.replace("./Login.html");
    }

    const subjectSelect = document.getElementById("subject");
    const classSelect = document.getElementById("class");
    const instructorSelect = document.getElementById("instructor");
    const assistantsBox = document.getElementById("assistants");
    const saveBtn = document.getElementById("saveBtn");
    const messageBox = document.getElementById("message");

    function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.className = isError ? "error" : "success";
    }

    function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "";
    }

    async function api(path, options = {}) {
        const headers = {
            Authorization: `Bearer ${token}`,
            ...options.headers
        };

        if (options.body) {
            headers["Content-Type"] = "application/json";
        }

        const response = await fetch(path, {
            ...options,
            headers
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            const error = new Error(
                data.message || `HTTP ${response.status}`
            );
            error.status = response.status;
            throw error;
        }

        return data;
    }

    function addOption(select, value, text) {
        select.add(new Option(text, value));
    }

    function renderStaff(instructors, assistants) {
        instructorSelect.replaceChildren(
            new Option("-- Chọn giảng viên chính --", "")
        );

        for (const user of instructors) {
            addOption(
                instructorSelect,
                user.id,
                `${user.name} (${user.email})`
            );
        }

        assistantsBox.replaceChildren();

        if (assistants.length === 0) {
            assistantsBox.textContent = "Chưa có trợ giảng phù hợp.";
            return;
        }

        for (const user of assistants) {
            const label = document.createElement("label");
            label.className = "assistant-option";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = user.id;
            checkbox.name = "assistantId";

            const name = document.createElement("span");
            name.textContent = `${user.name} (${user.email})`;

            label.append(checkbox, name);
            assistantsBox.appendChild(label);
        }
    }

    function clearAssignment() {
        instructorSelect.value = "";

        document.querySelectorAll(
            'input[name="assistantId"]'
        ).forEach(box => {
            box.checked = false;
        });
    }

    async function loadExistingAssignment() {
        clearAssignment();
        clearMessage();

        const classId = classSelect.value;
        const subjectId = subjectSelect.value;

        saveBtn.disabled = !classId;

        if (!classId || !subjectId) return;

        try {
            const result = await api(
                `/api/teaching-assignments/${encodeURIComponent(classId)}/${encodeURIComponent(subjectId)}`
            );

            if (
                classSelect.value !== classId ||
                subjectSelect.value !== subjectId
            ) return;

            const assignment = result.data;

            instructorSelect.value = assignment.instructorId;

            document.querySelectorAll(
                'input[name="assistantId"]'
            ).forEach(box => {
                box.checked = assignment.assistantIds.includes(
                    box.value
                );
            });

            showMessage("Đã tải phân công hiện tại.");
        } catch (error) {
            if (error.status === 404) {
                showMessage("Lớp này chưa có phân công.");
            } else {
                showMessage(error.message, true);
            }
        }
    }

    async function loadClasses() {
        clearMessage();
        saveBtn.disabled = true;

        classSelect.replaceChildren(
            new Option("-- Chọn lớp học --", "")
        );

        const subjectId = subjectSelect.value;

        if (!subjectId) return;

        try {
            const result = await api(
                `/api/subjects/${encodeURIComponent(subjectId)}/classes`
            );

            if (subjectSelect.value !== subjectId) return;

            const classes = result.classes || [];

            for (const cls of classes) {
                addOption(
                    classSelect,
                    cls.id,
                    `${cls.code} - ${cls.name}`
                );
            }

            if (classes.length === 0) {
                showMessage(
                    "Môn này chưa có lớp học để phân công.",
                    true
                );
            }
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    async function loadInitialData() {
        try {
            const [subjectsData, instructorsData, assistantsData] =
                await Promise.all([
                    api("/api/subjects?limit=100"),
                    api("/api/teaching-assignments/eligible-staff?role=instructor"),
                    api("/api/teaching-assignments/eligible-staff?role=teaching_assistant")
                ]);

            const subjects =
                subjectsData.subjects ||
                subjectsData.data ||
                subjectsData.items ||
                [];

            subjectSelect.replaceChildren(
                new Option("-- Chọn môn học --", "")
            );

            for (const subject of subjects) {
                addOption(
                    subjectSelect,
                    subject.id,
                    `${subject.code} - ${subject.name}`
                );
            }

            renderStaff(
                instructorsData.data || [],
                assistantsData.data || []
            );

            if (subjects.length === 0) {
                showMessage(
                    "Không tìm thấy môn học. Cần kiểm tra API /api/subjects.",
                    true
                );
            }
        } catch (error) {
            showMessage(
                "Không tải được dữ liệu: " + error.message,
                true
            );
        }
    }

    subjectSelect.addEventListener("change", loadClasses);
    classSelect.addEventListener(
        "change",
        loadExistingAssignment
    );

    document.getElementById("assignmentForm")
        .addEventListener("submit", async event => {
            event.preventDefault();
            clearMessage();

            const classId = classSelect.value;
            const subjectId = subjectSelect.value;
            const instructorId = instructorSelect.value;

            const assistantIds = [
                ...document.querySelectorAll(
                    'input[name="assistantId"]:checked'
                )
            ].map(box => box.value);

            if (!classId || !subjectId || !instructorId) {
                showMessage(
                    "Vui lòng chọn môn, lớp và giảng viên chính.",
                    true
                );
                return;
            }

            saveBtn.disabled = true;

            try {
                await api(
                    `/api/teaching-assignments/${encodeURIComponent(classId)}/${encodeURIComponent(subjectId)}`,
                    {
                        method: "PUT",
                        body: JSON.stringify({
                            instructorId,
                            assistantIds
                        })
                    }
                );

                showMessage(
                    "Phân công thành công và đã lưu dữ liệu!"
                );
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                saveBtn.disabled = false;
            }
        });

    if (token) {
        loadInitialData();
    }
</script>
</body>
</html>
