<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành công</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .success-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .icon-success { width: 70px; height: 70px; background-color: #28a745; color: white; border-radius: 50%; font-size: 40px; line-height: 70px; margin: 0 auto 20px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
        .btn-home { display: inline-block; width: 100%; padding: 14px; background-color: #28a745; color: white; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; }
        .btn-home:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="icon-success">✓</div>
        <h2>Đăng Ký Thành Công!</h2>
        <p>Cảm ơn bạn đã tạo tài khoản. Chúng tôi đã gửi một email xác thực đến địa chỉ của bạn.</p>
        <a href="index.html" class="btn-home">Quay lại trang chủ</a>
    </div>
</body>
</html>
