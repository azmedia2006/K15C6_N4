<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo lịch học · TMS</title>
<script src="/authGuard.js" data-required="student,instructor,training_manager,administrator,teaching_assistant,admissions,accountant,visitor,technical_manager"></script>
<style>body{font:16px/1.6 Arial,sans-serif;background:#f4f7fb;color:#182b49;margin:0}main{max-width:900px;margin:40px auto;padding:24px}a{color:#2256b6}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}article{background:white;border:1px solid #dbe3ee;border-radius:12px;padding:20px;margin:16px 0}article.unread{border-left:5px solid #285fcb}button{font:inherit;background:#245ac2;color:white;border:0;padding:9px 16px;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}time,small{color:#56657b}#status{color:#485b77}h1{font-size:28px;margin:12px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><header><div><a href="/Dashboard.html">← Về bảng điều khiển</a><h1>Thông báo lịch học</h1></div><button id="refresh">Tải lại</button></header><p>Chỉ hiển thị thông báo của tài khoản đang đăng nhập. Tự tải lại mỗi 30 giây.</p><p id="status" role="status"></p><section id="inbox" aria-label="Thông báo"></section></main>
<script>
const token = localStorage.getItem('tms_token') || localStorage.getItem('token') || '';
async function loadInbox(){
 try {
  const response=await fetch('/api/schedule-notifications',{headers:{Authorization:'Bearer '+token}});const data=await response.json();if(!response.ok)throw new Error(data.message||'Không tải được thông báo.');
  document.getElementById('status').textContent=data.notifications.length ? `${data.notifications.filter(n=>!n.readAt).length} chưa đọc / ${data.notifications.length} thông báo` : 'Chưa có thông báo thay đổi lịch học.';
  const inbox=document.getElementById('inbox');inbox.replaceChildren();
  data.notifications.forEach(n=>{const article=document.createElement('article');article.className=n.readAt?'':'unread';const heading=document.createElement('strong');heading.textContent='Thay đổi lịch học · '+n.classId;const text=document.createElement('p');text.textContent=n.message;const date=document.createElement('time');date.textContent=new Date(n.createdAt).toLocaleString('vi-VN');article.append(heading,text,date);if(!n.readAt){const button=document.createElement('button');button.textContent='Đánh dấu đã đọc';button.style.marginLeft='16px';button.onclick=async()=>{button.disabled=true;try{const res=await fetch('/api/schedule-notifications/'+encodeURIComponent(n.id)+'/read',{method:'PATCH',headers:{Authorization:'Bearer '+token}});if(!res.ok)throw new Error('Không đánh dấu được thông báo.');await loadInbox();}catch(e){document.getElementById('status').textContent=e.message;button.disabled=false;}};article.append(button);}inbox.append(article);});
 }catch(e){document.getElementById('status').textContent=e.message;}
}
document.getElementById('refresh').onclick=loadInbox;loadInbox();setInterval(loadInbox,30000);
</script></body></html>
